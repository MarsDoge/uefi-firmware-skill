g]\n    related_skills: []\n  domain: firmware\n  languages: [en, zh]\n  topics: [UEFI, PI, edk2, HII, VFR, IFR, ACPI, SMBIOS, TCG, TPM, Secure Boot, QEMU]\n---\n\n# UEFI Firmware\n\n## Overview\n\nUse this skill as a UEFI firmware navigation layer. It helps explain concepts,\nlocate the right standards or edk2 source areas, debug firmware symptoms, and\nreview firmware patches while preserving the boundary between standard behavior,\nedk2 implementation behavior, and platform/vendor policy.\n\nPrefer bilingual answers when useful: Chinese explanations are welcome, but keep\nofficial English terms such as `Protocol`, `Handle`, `HOB`, `DXE`, `HII`, `VFR`,\n`IFR`, `FormBrowser`, `ConfigAccess`, `Secure Boot`, and `SMBIOS` intact.\n\n## Start Here / 阅读入口\n\nUse this compact decision flow; load only the reference needed for the question:\n\n`Define the question → locate phase/owner → collect evidence → propose a judgment or fix → verify → report and distill`\n\nIf evidence is insufficient or a hypothesis fails, return to phase/owner and\ncollect new evidence. Adapt the steps to the task: conceptual explanations do not\nrequire a build; runtime claims require corresponding execution evidence.\n\n| Question / 问题 | Read first / 优先读取 |\n| --- | --- |\n| Terminology or specification compliance / 术语与规范 | `references/uefi-spec-map.md` |\n| Module ownership or initialization / 职责与初始化 | `references/edk2-map.md` |\n| Build, crash, boot entries, loaded artifacts / 构建、异常与启动 | `references/debugging-map.md` |\n| HII / Setup rendering and writeback / 显示与写回 | `references/edk2-map.md`, then `references/debugging-map.md` |\n| Patch compatibility or failure cleanup / 补丁兼容与失败清理 | `references/distillation-method.md`, then `references/upstreaming.md` |\n| Concrete command templates / 命令模板 | `references/workflows.md` |\n\nFor the complete explicit workflow, read `references/decision-flow.md`.\nFor cross-topic discovery, use `maps/network.json`: stable node IDs, typed directed\nrelations, and exact source paths/lines/excerpts. Search or expand without loading\nthe entire graph using `python3 scripts/query_network.py --search 'BootOrder'`\nor `python3 scripts/query_network.py --node boot --depth 2 --kind semantic` from\nthe skill directory. Traversal uses undirected adjacency for discovery, not causal\ninference. Follow the source reference before applying a rule.\nHumans can open the standalone `maps/network.html` to explore all recorded links;\n`maps/network.svg` is its static overview. The sequential flow remains in\n`maps/reasoning.svg` and `maps/preview.html`. Agents do not need image recognition\nor a diagram renderer. Do not load the entire reference\nlibrary by default. Report conclusions, evidence, scope, and missing checks,\nnot private internal reasoning.\n\n## Distilled Reasoning Reference / 蒸馏推理参考\n\nThis skill includes a distilled firmware-reasoning note/reference alongside the\nmain UEFI guidance; it is not a copied specification bundle. The included\nreasoning pattern is: classify firmware phase first, separate\nspec/edk2/platform/tool layers, inspect source and logs before guessing,\npreserve compatibility evidence, and answer with a verification path.\n\nThe detailed note lives in `references/distillation-method.md`. Keep the\nNuwa-style skill distillation inspiration scoped to that reference method, adapted\nto domain reasoning rather than personality imitation.\n\n## When to Use / 适用场景\n\nUse this skill for:\n\n- UEFI, PI, ACPI, SMBIOS, TCG/TPM, Secure Boot terminology and boundary questions.\n- edk2 source orientation, package/module/library patterns, and build triage.\n- HII/VFR/IFR/FormBrowser setup UI analysis and debugging.\n- QEMU/OVMF firmware debug, serial logs, ASSERTs, and EFI status investigation.\n- Firmware patch review where evidence, compatibility, and upstream wording matter.\n\n## When Not to Use / 不适用场景\n\nDo not rely on this skill alone for:\n\n- Vendor-private behavior, unreleased platform policy, or NDA documentation.\n- Exact current spec wording/version claims without checking official sources.\n- Hardware-specific diagnosis without logs, board details, toolchain, and build data.\n- Replacing edk2 maintainers' guidance, platform owners' documentation, or security review.\n\n## First Decision\n\nClassify the request before answering:\n\n- **Concept explanation**: explain the term, boot phase, and where it appears in\n  UEFI/PI/edk2.\n- **Specification lookup**: use official specs or project docs first, then cite\n  exact sections when browsing is available or requested.\n- **Code orientation**: inspect the local tree first; do not guess file names\n  when a repository is available.\n- **Debugging**: start from symptoms, logs, platform, architecture, toolchain,\n  and the exact phase where behavior changes.\n- **Patch/review**: separate correctness, compatibility, coding style, tests,\n  and upstream wording.\n\n## Core Workflows\n\n1. Identify phase and owner: SEC, PEI, DXE, BDS, SMM/MM, boot loader, or OS handoff.\n2. Separate layers: specification contract, edk2 implementation, platform policy,\n   and toolchain/QEMU/hardware behavior.\n3. Choose evidence for the question: specifications for requirements, source and\n   configuration for implementation behavior, and execution for observed results.\n4. Trace the producer-to-consumer chain, including availability, lifetime, build\n   inclusion, and runtime use; a component build alone does not prove integration.\n5. Fix the owning layer with the smallest semantically complete change.\n6. Verify the actual loaded artifact and the intended behavior, including relevant\n   failure paths.\n7. Bound conclusions by evidence: distinguish static findings, build results,\n   executed tests, and platform compatibility.\n\nLoad focused references as needed. For reusable rules with short examples and\nexplicit limits, read `references/distillation-method.md`.\n\nFor command-level templates, read `references/workflows.md`.\n\n## Reference Routing\n\nLoad only the reference needed for the current task:\n\n- For practical command-level templates and evidence collection, read\n  `references/workflows.md`.\n- For distilled reasoning, call-time dependency checks, interface evolution, and\n  failure ownership, read `references/distillation-method.md`.\n- For UEFI/PI/ACPI/SMBIOS/TCG/Secure Boot standard boundaries and official links,\n  read `references/uefi-spec-map.md`.\n- For edk2 packages, build files, firmware phases, HII, protocols, and library\n  patterns, read `references/edk2-map.md`.\n- For QEMU, serial logs, ASSERTs, build failures, EFI status values, setup UI,\n  build-to-run tracing, cross-architecture faults, and missing boot entries,\n  read `references/debugging-map.md`.\n- For patch review, commit messages, copyright, sign-off, and mailing-list or PR\n  wording, read `references/upstreaming.md`.\n\n## Common Pitfalls\n\n- Treating vendor/platform policy as if it were required by the UEFI specification.\n- Mixing UEFI Secure Boot with TCG measured boot or TPM policy without stating the boundary.\n- Guessing edk2 file paths instead of searching the local tree.\n- Debugging HII setup UI only at the visual layer while ignoring VFR/IFR,\n  `ConfigAccess`, varstore, and FormBrowser behavior.\n- Reviewing firmware patches without architecture, firmware volume size, variable\n  store, QEMU/hardware, and toolchain compatibility evidence.\n\n## Working Rules\n\n- Do not present vendor-private behavior as UEFI standard behavior.\n- Distinguish standard contracts from edk2 implementation choices and platform policy.\n- For current versions, URLs, issue state, mailing-list state, or exact spec text,\n  verify with official sources instead of relying on memory.\n- When a local repo exists, prefer `search_files`, `rg`, `git grep`, build logs,\n  and actual source inspection over broad explanations.\n- Avoid rewriting `FormBrowser`/HII semantics unless the user explicitly wants a\n  replacement; for edk2 setup UI work, prefer preserving native HII/FormBrowser\n  semantics and changing the display layer.\n- For high-risk firmware changes, include the test surface: architecture,\n  platform, boot phase, QEMU/real hardware, toolchain, and regression cases.\n\n## Verification Checklist\n\nBefore finalizing an answer or review, check:\n\n- Is the claim labeled as spec, edk2 implementation, platform policy, or tool behavior?\n- Is there a source path, log line, GUID/protocol, command, test, or spec link as evidence?\n- Are architecture, platform, boot phase, toolchain, and QEMU/hardware scope clear?\n- Are security-sensitive topics such as Secure Boot, TPM, SMM/MM, and variables treated conservatively?\n- Is any remaining uncertainty stated with a concrete next verification step?\n\n## Useful Answer Shape\n\nFor most UEFI questions:\n\n1. State the direct answer.\n2. Identify whether it is UEFI spec, PI spec, edk2 implementation, or platform policy.\n3. Point to the relevant source/spec area.\n4. Give the practical debug or implementation consequence.\n5. Mention remaining uncertainty and how to verify it.\n", "references/debugging-map.md": "# UEFI Debugging Map\n\nUse this reference for firmware build failures, boot hangs, QEMU symptoms,\nsetup UI issues, and logs.\n\n## First Data To Collect\n\n- Platform and architecture: x86, AArch64, RISC-V, LoongArch, or other.\n- Environment: QEMU version, accelerator, machine type, firmware image, variable\n  store, disk image, and command line.\n- Toolchain: GCC/Clang version, target triple, build target, architecture.\n- Phase where it fails: SEC, PEI, DXE dispatch, BDS, setup UI, boot loader, OS\n  kernel handoff.\n- Exact log line, ASSERT, EFI status, or crash address.\n\n## Build Failures\n\n- Check the first compiler or linker diagnostic, not only the final make error.\n- For edk2, inspect the module being built, selected toolchain, selected library\n  instances, and generated AutoGen paths.\n- Clang and GCC flags are not interchangeable; verify architecture-specific\n  flags against the exact compiler version.\n- If a BaseTools utility fails, separate input file corruption from tool logic.\n\n## QEMU Firmware Hangs\n\n- Compare acceleration modes: for example `tcg` vs `hvf` or `kvm`.\n- Compare machine options that affect interrupt controllers, timer devices,\n  memory map, firmware volumes, and graphics devices.\n- Capture serial logs and identify the last successful firmware phase.\n- For BDS waits or boot manager stalls, check boot options, device connection,\n  variable store freshness, and input/display availability.\n\n## Setup UI Debugging\n\n- If a native HII page is wrong, decide whether the bug is in the HII producer,\n  SetupBrowser/FormBrowser, DisplayEngine, GraphicsConsole, font rendering, or\n  GOP mode selection.\n- Missing glyphs are a renderer/font problem unless HII strings are corrupt.\n- Incorrect hidden/grayed state is usually FormBrowser/IFR expression or current\n  configuration state, not pure drawing.\n- Failed writes should be traced through `ConfigAccess.RouteConfig()` and the\n  owning driver.\n\n## EFI Status Interpretation\n\n- Always preserve the exact `EFI_STATUS` value and symbolic name if available.\n- `EFI_NOT_FOUND` often means missing protocol, variable, handle, package, or\n  target object; it is not specific enough without call-site context.\n- `EFI_UNSUPPORTED` can be a deliberate platform/driver policy.\n- `EFI_INVALID_PARAMETER` often indicates contract mismatch, buffer size/state,\n  or wrong optional field assumptions.\n\n## Controlled Validation / 受控验证\n\n**Rule:** Compare baseline and patched behavior with the relevant environment held\nconstant. Record the revision, build configuration, loaded image, boot media, and\ninitial variable-store state. Preserve the failing state before testing a fresh\nstore, and change one relevant factor at a time.\n\n**Example:** If a changed Setup page still looks identical, confirm the loaded\napplication first, then navigate to that page, exercise the affected interaction,\nand inspect both the display and exception/ASSERT logs.\n\n**Limit:** Reaching the boot menu is not validation of a changed page. A screenshot\nproves appearance at that moment, not persistence or successful configuration\nwriteback. Use the acceptance behavior to choose the additional checks.\n\n## Build-to-Run Trace / 从构建追到运行\n\n**Rule:** Check each relevant boundary: source and configuration, build tool,\ngenerated module, packaged firmware, deployed boot media, and actual load path.\nRecord artifact identities and logs. After changing a conversion or packaging tool,\nverify that downstream images were regenerated with it, not merely that the tool\nitself was rebuilt.\n\n**Example:** After a GenFw change, regenerate the affected EFI images and firmware,\nthen confirm that QEMU loads that firmware. If the application is loaded from an\nESP, update and verify that copy separately. Use a clean rebuild when incremental\ndependency tracking cannot establish which tool produced the image.\n\n**Limit:** Full rebuilds are not required for every edit. A hash identifies bytes,\nnot correctness or proof of execution; connect it to the configured and observed\nload path. Do not reset the variable store as a side effect of refreshing code.\n\n## Cross-Architecture Fault Localization / 跨架构异常定位\n\n**Rule:** Identify the faulting module and exact build before symbolizing an\naddress. Distinguish runtime addresses, PE RVAs, ELF virtual addresses, and file\noffsets; derive conversions from the loader and section layout. Use target-aware\ndisassembly to inspect the failing instruction, relocation target, and stack frame.\n\n**Example:** For a crash near a rendering function, map the fault to the matching\ndebug image and inspect the generated prologue and callees for large stack\nallocations or inlining. For a bad relocated pointer, trace its original target\nand transformed section address instead of substituting an RVA into an ELF formula.\n\n**Limit:** Subtracting the runtime image base gives an image-relative address, not\na universally valid input to an ELF symbolizer. Large stack frames are a hypothesis,\nnot a diagnosis by themselves. Exception names, relocation rules, and generated\ncode differ by architecture and toolchain; an X64 build does not validate another\ntarget's link or runtime behavior.\n\n## Device Visibility versus Boot Entries / 设备可见与启动项分开排查\n\n**Rule:** Trace discovery, driver connection, filesystem or loader access, boot\npolicy, and persistent boot-entry updates as separate steps. Inspect the relevant\nBoot#### and BootOrder operations and their exact status before blaming device\nenumeration or changing boot policy.\n\n**Example:** If Shell exposes a filesystem but Setup has no corresponding boot\nentry, inspect the boot-option creation path and variable-write results. A failed\nwrite may explain the missing entry even though filesystem discovery succeeded.\n\n**Limit:** A visible filesystem proves neither a valid loader nor eligibility under\nplatform boot policy. A missing entry does not prove variable-store exhaustion.\nPreserve the failing store for diagnosis; do not automatically delete user boot\nentries or substitute a fresh store and call the original problem fixed.\n\n## Good Debug Answer Pattern\n\n1. Identify the phase and component.\n2. State the most likely ownership boundary.\n3. Show the source/log evidence.\n4. Propose the smallest comparison test.\n5. Avoid changing unrelated firmware policy while debugging display or parser\n   symptoms.\n", "references/decision-flow.md": "\u003c!-- Generated by scripts/render_reasoning.py; edit maps/reasoning.json. -->\n# Decision Flow / 工程决策流程\n\n人看图，Agent 按路径读取；这是工程决策流程，不是模型内部思维记录。\n\nRead only the references needed for the current question. This is an explicit engineering workflow, not a request to expose private model reasoning.\n\n## 01 定义问题 / scope\n\n要解释、排障，还是审核补丁？\n\n记录目标、现象、架构与已知条件；缺少关键输入时先收集，不猜测。\n\nOutput: 明确目标与未知条件\n\nRead: [distillation-method.md](distillation-method.md)\n\n## 02 定位阶段与职责 / locate\n\n问题发生在哪里，谁拥有它？\n\n定位启动阶段，跟踪生产者 → 接口 → 消费者；检查依赖何时可用。概念问题只定位相关阶段与接口。\n\nOutput: 阶段、责任组件与依赖\n\nRead: [edk2-map.md](edk2-map.md), [distillation-method.md](distillation-method.md)\n\n## 03 选择并收集依据 / evidence\n\n这是规范要求，还是具体实现？\n\n区分规范契约、edk2 实现、平台策略和工具行为；按问题读取适用规范、当前源码与配置、日志。\n\nOutput: 可追溯依据及适用条件\n\nRead: [uefi-spec-map.md](uefi-spec-map.md), [debugging-map.md](debugging-map.md)\n\n## 04 提出判断或修复 / decide\n\n证据支持什么？怎样验证？\n\n解释类给出有边界的结论；排障类提出可检验假设；补丁类选择职责所属层的最小完整修复，检查兼容与失败路径。\n\nOutput: 候选结论、假设或修复方案\n\nRead: [distillation-method.md](distillation-method.md), [upstreaming.md](upstreaming.md)\n\n## 05 验证目标行为 / verify\n\n验证了目标行为，还是中间步骤？\n\n按主张选择验证：规范与源码核对，或基线对照、目标架构构建、实际产物运行。检查相关失败路径；证据不足则返回定位，不把未测当作通过。\n\nOutput: 验证结果、失败证据或明确缺口\n\nRead: [debugging-map.md](debugging-map.md), [workflows.md](workflows.md)\n\n## 06 输出并沉淀 / distill\n\n结论适用哪里？哪些仍未知？\n\n报告结论、依据、验证范围和缺口；可复用经验整理为规则 → 例子 → 边界，经审核后更新，不能把单次案例泛化为标准。\n\nOutput: 可使用的答案与候选经验\n\nRead: [distillation-method.md](distillation-method.md), [upstreaming.md](upstreaming.md)\n\n## Routing / 按问题查阅\n\n- 术语、标准、规范是否合法 → [uefi-spec-map.md](uefi-spec-map.md), [distillation-method.md](distillation-method.md)\n- 模块职责、接口、初始化依赖 → [edk2-map.md](edk2-map.md), [distillation-method.md](distillation-method.md)\n- 构建失败、异常、启动项缺失、旧产物 → [debugging-map.md](debugging-map.md), [workflows.md](workflows.md)\n- HII / Setup 显示与设置写回 → [edk2-map.md](edk2-map.md), [debugging-map.md](debugging-map.md)\n- 补丁正确性、兼容性与失败清理 → [distillation-method.md](distillation-method.md), [upstreaming.md](upstreaming.md)\n\n## Transitions / 路径\n\n- scope → locate\n- locate → evidence\n- evidence → decide\n- decide → verify\n- verify → distill\n- verify → locate (insufficient evidence / unsupported hypothesis)\n", "references/distillation-method.md": "# UEFI Firmware Skill Distillation Method\n\nThis reference describes what the skill is trying to preserve: not a database of\nfacts, but the working style of a careful UEFI firmware engineer.\n\nThe method is inspired by skill distillation projects such as\n`alchaincyf/nuwa-skill`, but adapts the idea from \"how a person thinks\" to \"how\na firmware expert should reason\". Do not role-play a person. Run the workflow.\n\n## Core Mental Models\n\n### 1. Phase First\n\nEvery firmware symptom belongs to a phase or a phase boundary.\n\n- SEC/PEI symptoms usually involve early entry, memory discovery, PPIs, HOBs, or\n  firmware volume access.\n- DXE symptoms usually involve driver dispatch, protocols, handles, variables,\n  runtime drivers, or device connection.\n- BDS symptoms usually involve boot policy, boot options, UI, shell, or OS\n  loader handoff.\n- OS handoff symptoms usually involve memory map, `ExitBootServices()`, ACPI,\n  device tree, initrd/kernel placement, or runtime mappings.\n\nIf the phase is unknown, ask for or inspect serial logs before proposing a fix.\n\n### 2. Four-Layer Separation\n\nClassify every claim into one of four layers:\n\n- **Specification contract**: UEFI, PI, ACPI, SMBIOS, TCG, or architecture ABI.\n- **edk2 implementation**: the behavior of a concrete edk2 module or library.\n- **Platform policy**: DSC/FDF choices, library instances, PCDs, boot policy,\n  board/OEM decisions, or IBV custom behavior.\n- **Tool behavior**: compiler, BaseTools, QEMU, accelerator, debugger, or host\n  environment.\n\nDo not turn an edk2 behavior into a spec rule. Do not turn a platform workaround\ninto a generic firmware rule.\n\n### 3. Producer/Consumer Ownership\n\nFor every protocol, HII package, variable, ACPI table, SMBIOS record, or device\npath, identify:\n\n- who produces it,\n- who consumes it,\n- when it becomes available,\n- whether it is required by standard contract or platform policy.\n\nThis prevents fixes in the wrong layer. For example, a setup UI visual issue may\nbelong to DisplayEngine, while a hidden/grayed condition belongs to FormBrowser\nor the HII producer.\n\n### 4. Compatibility Surface\n\nA firmware answer is incomplete until it states where it was validated:\n\n- architecture: IA32/X64, AArch64, RISC-V, LoongArch, or other;\n- platform: QEMU virtual platform, reference board, server board, laptop, etc.;\n- boot mode and variable-store state;\n- toolchain and build target;\n- relevant firmware volume size or memory-map constraint;\n- real hardware vs emulator.\n\n### 5. Minimal Semantic Change\n\nFor compatibility work, prefer the smallest change that preserves existing UEFI\nsemantics. In edk2 setup UI work, this often means:\n\n- keep HII/VFR/IFR parsing in SetupBrowser/FormBrowser;\n- keep `ConfigAccess` callbacks and variable writeback with the owning driver;\n- change rendering through DisplayEngine/GOP only when the problem is visual;\n- keep native fallback paths until enough forms are verified.\n\n## Decision Heuristics\n\n- If the question asks \"what does this mean\", first map the term to phase and\n  spec family.\n- If the question asks \"why does this hang\", first find the last log line and\n  compare one variable at a time.\n- If the question asks \"should we change this\", first identify the owner and\n  compatibility blast radius.\n- If the question asks \"is this a bug\", compare spec contract, edk2 behavior, and\n  another platform or architecture.\n- If the question asks for upstream wording, make claims narrow and evidence\n  based.\n\n## Engineering Rules and Examples / 工程规则与例子\n\nThese rules apply across architectures and platforms. Examples illustrate the\nreasoning, not universal implementation requirements or claims of completed tests.\nKeep incident-specific commands and project history out of the core model.\n\n### 1. Choose Evidence for the Question / 按问题选择证据\n\n**Rule:** There is no universal evidence ranking. Use the applicable specification\nversion and section for normative requirements, exact source and configuration\nfor implementation behavior, and execution evidence for observed results. History\nand review discussions explain intent; label inference separately.\n\n**Example:** Linux accepting an ACPI record demonstrates behavior of that consumer\non the tested path. Check the applicable ACPI record and method constraints before\ncalling the encoding compliant.\n\n**Limit:** Consumer acceptance does not establish specification compliance or\nprove that a related operation such as hotplug works.\n\n### 2. Trace the Complete Chain / 检查完整链路\n\n**Rule:** Follow data from producer through interface to consumer. Check identity,\navailability, lifetime, build inclusion, packaging, and actual runtime use before\nclaiming a feature is integrated.\n\n**Example:** After building an ACPI generator, check that the platform supplies its\ninputs, the generator is registered in the running image, the generated table is\ninstalled, and the OS receives the intended data.\n\n**Limit:** A schema that can express the data is not a platform integration.\nEquivalent consumer-visible behavior is also a different claim from byte identity.\n\n### 3. Fix the Owning Layer / 在职责所属层修复\n\n**Rule:** Identify ownership before editing. Prefer the smallest change that fully\nrepairs the relevant contract, rather than the fewest changed lines. Keep unrelated\npolicy changes and hardening separate.\n\n**Example:** A Setup layout defect may belong to rendering, while an incorrect\nhidden or disabled state may come from form expressions or current configuration.\nTrace the cause instead of forcing visibility in the drawing code.\n\n**Limit:** This is not a blanket preference for display-layer fixes; preserve the\nconfiguration owner's validation and writeback responsibilities.\n\n### 4. Verify the Artifact Being Run / 确认实际运行产物\n\n**Rule:** Connect the source revision and build configuration to the generated\nartifact and actual load path. Preserve enough information to repeat the test.\n\n**Example:** Rebuilding firmware may leave a standalone UEFI application on the ESP\nunchanged. Confirm or refresh the loaded application before attributing a changed\nresult to the patch.\n\n**Limit:** A successful build or a new timestamp alone does not prove that the\nrunning image contains the change. Track the relevant image, inputs, and logs.\n\n### 5. Test the Promised Behavior / 按目标行为验收\n\n**Rule:** Test the consumer-visible outcome, not just an intermediate success code.\nCover relevant boundaries, error propagation, and cleanup according to the\ninterface contract.\n\n**Example:** For a setting, verify modification, save, reread, and the intended\nvisible effect. Reboot if persistence across reboot is required. A failed write\nmust not be presented as a successful save.\n\n**Limit:** Persistence is not required for every setting; acceptance follows the\ndeclared behavior, not a checklist copied from another feature.\n\n### 6. Bound Conclusions by Evidence / 结论不超出证据\n\n**Rule:** Separate static reasoning, reproduced failures, compilation, executed\ntests, and platform compatibility. Report a finding's trigger, impact, evidence,\nand smallest complete remedy. A missing test is not itself a demonstrated bug.\n\n**Example:** A host test checking an ACPI generator's serialized fields supports\nthat serialization claim. It does not establish firmware integration or OS boot\non the target board.\n\n**Limit:** Static analysis can prove a defect without reproduction when the input\nand control flow establish it. State that basis explicitly instead of inventing a\nfailed run or treating every hypothetical edge case as a blocker.\n\n### 7. Check Dependencies at the Call Site / 按调用时机检查依赖\n\n**Rule:** Check what is available when a function runs, not merely what its module\nlinks. Follow the selected library instance and its transitive dependencies:\nconstructors, initialized state, memory, services, and protocol producers. For\ninitialization failures, also check whether dispatch dependencies form a cycle.\n\n**Example:** An early entry path calling an RNG library needs an implementation\nusable at that point. Inspect whether the selected instance relies on a constructor\nor protocol that becomes available later; a successful link does not answer this.\n\n**Limit:** Do not ban a library class based on one instance. Availability depends\non the actual instance, configuration, and entry sequence. A fallback must satisfy\nthe caller's contract; a security-critical failure may require stopping instead.\n\n### 8. Review Interface Evolution and Failure Ownership / 检查接口演进与失败归属\n\n**Rule:** When extending an interface, check how consumers establish that an\noptional field or method exists before accessing it. Trace resource ownership and\nstate transitions through every relevant failure edge, including partial success.\nUse the interface's documented compatibility mechanism rather than assuming that\nall producers were rebuilt together.\n\n**Example:** For a revisioned protocol extended with a trailing method, check the\nrequired revision before reading that method. For a map-then-permit operation,\ncheck how a failed permission step releases the successful mapping and any owned\nbuffer, and which error the caller receives.\n\n**Limit:** Not every protocol has a revision field, and a NULL check cannot make an\nout-of-layout read safe. Cleanup must respect ownership and API semantics: do not\nfree caller-owned resources or claim rollback succeeded when cleanup failed.\n\n## Answer DNA\n\nGood answers should be direct, bounded, and operational:\n\n- \"This is spec behavior\" vs \"this is edk2's implementation\".\n- \"The owner is likely this module because it produces this protocol/string.\"\n- \"The next comparison test is X vs Y.\"\n- \"This is safe only if these architectures/platforms still pass.\"\n- \"I am inferring this from source/logs; verify by checking this path.\"\n\nAvoid:\n\n- vague statements like \"UEFI does this\" when only one platform does;\n- changing HII semantics to solve a rendering problem;\n- suggesting broad refactors before isolating the phase;\n- hiding uncertainty;\n- copying vendor-private UI or policy as if it were open firmware practice.\n", "references/edk2-map.md": "# edk2 Map\n\nUse this reference when the user asks how edk2 is structured, where a feature\nlives, or how UEFI concepts map to source code.\n\n## Repository Concepts\n\n- `*.dec`: package declarations, GUIDs, PPIs, protocols, PCDs, and library class\n  declarations exported by a package.\n- `*.dsc`: platform build description, module list, library class resolutions,\n  PCD settings, architectures, and build options.\n- `*.fdf`: firmware device layout, firmware volumes, files, sections, capsules,\n  and image placement.\n- `*.inf`: module metadata, sources, packages, library classes, protocols, PPIs,\n  GUIDs, PCDs, and depex.\n- `*.vfr`: Visual Forms Representation source for HII setup forms.\n- `*.uni`: localized strings used by HII packages or module UI text.\n\n## Firmware Phases In edk2\n\n- **SEC**: earliest entry, temporary execution environment, handoff to PEI.\n- **PEI**: memory discovery, PPIs, HOB construction, PEIM dispatch.\n- **DXE**: driver dispatch, protocols, boot services, runtime services drivers.\n- **BDS**: boot policy, boot options, front page, boot manager, shell, OS loader.\n- **SMM/MM**: privileged management mode, SMI/MM handlers and isolated services.\n\n## Package Orientation\n\n- `MdePkg`: UEFI/PI base types, protocols, GUIDs, library interfaces.\n- `MdeModulePkg`: common UEFI drivers, SetupBrowser, HII database, UI app,\n  variable services, boot manager libraries.\n- `UefiCpuPkg`: CPU initialization and CPU-related drivers.\n- `SecurityPkg`: Secure Boot, TPM/TCG, crypto and security modules.\n- `NetworkPkg`: UEFI network stack and network configuration.\n- `ShellPkg`: UEFI Shell.\n- `ArmVirtPkg`, `OvmfPkg`, `EmulatorPkg`: common virtual platform examples.\n\n## HII/FormBrowser Orientation\n\n- HII database stores packages: strings, forms, fonts, images, keyboard layout,\n  and related data.\n- VFR compiles into IFR bytecode carried in HII form packages.\n- `SetupBrowserDxe`/FormBrowser interprets IFR, evaluates conditions, calls\n  `EFI_HII_CONFIG_ACCESS_PROTOCOL`, and manages question semantics.\n- Display engines render already-interpreted form state. Prefer changing display\n  engines for UI modernization instead of reimplementing IFR semantics.\n- `ConfigAccess.ExtractConfig()` reads current configuration and\n  `RouteConfig()` writes configuration back through the owning driver.\n\n## Source Inspection Habits\n\n- Use `rg` or `git grep` for GUID names, protocol names, PCDs, INF module names,\n  and error strings.\n- For behavior questions, inspect both the library class declaration and the\n  platform's library instance resolution in the DSC.\n- For setup UI issues, distinguish: HII producer driver, HII database,\n  SetupBrowser/FormBrowser, DisplayEngine, graphics console, and GOP.\n- For architecture-specific bugs, compare the same code path on another\n  architecture before assigning ownership.\n", "references/uefi-spec-map.md": "# UEFI Specification Map\n\nUse this reference when the user needs standards boundaries, terminology, or a\npath to official documentation. Prefer official URLs and cite exact versions or\nsections only after checking them. Do not copy specification text.\n\n## Source Hierarchy\n\n- **UEFI Specification**: boot services, runtime services, protocols, device\n  paths, variables, image loading, Secure Boot, HII, and Form Browser interfaces.\n- **PI Specification**: firmware phases and PI infrastructure such as SEC, PEI,\n  DXE, SMM/MM, PPIs, HOBs, FV/FFS, and dispatch models.\n- **ACPI Specification**: OS-visible platform description, power management,\n  processor/device description, AML, and tables such as DSDT/SSDT/FADT/MADT/SRAT.\n- **SMBIOS Specification**: inventory and management structures describing BIOS,\n  system, board, chassis, CPU, memory, slots, and firmware metadata.\n- **TCG PC Client / TPM specifications**: TPM measurements, event logs, PCRs,\n  TCG2 protocol usage, and measured boot concepts.\n- **edk2 documentation/source**: implementation behavior, package conventions,\n  build tools, maintainers, and coding practices.\n\n## Official Sources To Prefer\n\n### UEFI Forum\n\n- UEFI specifications landing page: https://uefi.org/specifications\n- UEFI specification documents landing page: https://uefi.org/specs/UEFI\n- Platform Initialization (PI) specification documents: https://uefi.org/specs/PI\n- ACPI specification documents hosted by UEFI Forum: https://uefi.org/specs/ACPI\n- UEFI Forum Learning Center and white papers: https://uefi.org/learning_center\n\n### DMTF\n\n- SMBIOS standard landing page: https://www.dmtf.org/standards/smbios\n- DMTF published documents index: https://www.dmtf.org/dsp/DSP0134\n\n### Trusted Computing Group (TCG)\n\n- TCG resource library: https://trustedcomputinggroup.org/resource-library/\n- TCG PC Client Platform Firmware Profile specification family:\n  https://trustedcomputinggroup.org/resource/pc-client-specific-platform-firmware-profile-specification/\n- TCG EFI Protocol specification family:\n  https://trustedcomputinggroup.org/resource/tcg-efi-protocol-specification/\n- TPM 2.0 Library specification landing page:\n  https://trustedcomputinggroup.org/resource/tpm-library-specification/\n\n### TianoCore / edk2\n\n- edk2 source repository: https://github.com/tianocore/edk2\n- edk2 documentation repository: https://github.com/tianocore/tianocore.github.io/wiki/EDK-II\n- edk2 build specification: https://tianocore-docs.github.io/edk2-BuildSpecification/release-1.28/\n- edk2 DSC specification: https://tianocore-docs.github.io/edk2-DscSpecification/release-1.28/\n- edk2 INF specification: https://tianocore-docs.github.io/edk2-InfSpecification/release-1.27/\n- edk2 DEC specification: https://tianocore-docs.github.io/edk2-DecSpecification/release-1.27/\n- edk2 FDF specification: https://tianocore-docs.github.io/edk2-FdfSpecification/release-1.28/\n- edk2 VFR specification: https://tianocore-docs.github.io/edk2-VfrSpecification/release-1.91/\n- edk2 Module Writer's Guide: https://tianocore-docs.github.io/edk2-ModuleWriteGuide/draft/\n- edk2 Driver Writer's Guide: https://tianocore-docs.github.io/edk2-UefiDriverWritersGuide/draft/\n- TianoCore contribution guidelines: https://github.com/tianocore/tianocore.github.io/wiki/EDK-II-Development-Process\n\n## Secure Boot / Measured Boot Boundary\n\n- UEFI owns Secure Boot variables, image authentication, signature databases, and\n  the boot service/runtime service interfaces around image loading and variables.\n- TCG owns measured boot concepts, PCR semantics, TPM event log formats, and TPM\n  command/library specifications.\n- edk2 implements both UEFI-facing and TCG-facing pieces, but platform policy\n  determines defaults, key enrollment flows, setup UI, and deployment constraints.\n- ACPI may expose TPM devices and related platform tables to the OS, but ACPI is\n  not the Secure Boot policy specification.\n\n## How To Answer Standards Questions\n\n- Say which spec family owns the concept.\n- If a concept spans specs, describe the boundary. Example: Secure Boot policy is\n  UEFI, TPM measurements are TCG, and OS table exposure may involve ACPI.\n- Do not quote long spec text. Summarize and cite official sections only after\n  the exact version has been checked.\n- If the user asks for latest behavior, verify the current spec version or\n  official project source.\n\n## Common Boundaries\n\n- `EFI_BOOT_SERVICES` exists before `ExitBootServices()` and is not available to\n  the OS after boot services exit.\n- `EFI_RUNTIME_SERVICES` are designed to remain callable after\n  `ExitBootServices()` where the OS preserves mappings and calling convention.\n- `LoadImage()` and `StartImage()` are UEFI image lifecycle services; platform\n  boot policy is usually BDS or platform boot manager logic.\n- `AllocatePages()` supports allocation by type, maximum address, or fixed\n  address, but allocator choice and memory map state are firmware behavior.\n- HII and Form Browser define setup UI data and interaction contracts; visual\n  styling is implementation-specific.\n- ACPI describes platform hardware to the OS; it is not a firmware setup UI\n  mechanism.\n- SMBIOS is inventory/management data; it is generally not a configuration\n  control path by itself.\n", "references/upstreaming.md": "# Upstreaming Firmware Changes\n\nUse this reference for edk2/UEFI patch review, commit messages, and upstream\ncommunication.\n\n## Review Priorities\n\n- Correctness against UEFI/PI/edk2 contracts.\n- Compatibility with existing platforms and architectures.\n- Scope: avoid unrelated refactors in bug fixes.\n- Build impact across supported toolchains and architectures.\n- Tests or reproduction steps that reviewers can run.\n- Clear defect or limitation, with before/after results only when actually tested.\n\n## Evidence-Bounded Findings / 有证据边界的问题说明\n\n**Rule:** Give each finding a trigger, impact, supporting evidence, and smallest\ncomplete fix. Distinguish demonstrated or statically proven defects from\ncompatibility risks, missing tests, and style suggestions. Judge severity against\nreachable inputs and actual supported configurations.\n\n**Example:** An untested allocation-failure path is a coverage gap. If inspection\nalso shows that the failure returns with an owned buffer unreleased, describe the\nspecific leak and control flow as a static finding; do not claim a reproduced leak\nunless the failure path was executed.\n\n**Limit:** Neither lack of reproduction nor lack of tests settles correctness.\nState what is proven and what remains uncertain. Cross-architecture implementations\nare comparison material, not substitutes for the target contract.\n\n## Commit Message Shape\n\n- Subject: concise subsystem prefix plus change.\n- Body: explain the bug or limitation, why the current behavior is wrong, and\n  why the fix is safe.\n- Include concrete error text or reproduction details when helpful.\n- Avoid overclaiming; prefer \"can fail\", \"may dereference\", or \"is not accepted\n  by Clang X\" when evidence is scoped.\n- Preserve author and sign-off unless explicitly changing ownership.\n\n## Firmware Review Language\n\n- Separate \"spec requires\", \"edk2 currently does\", and \"this platform needs\".\n- When discussing compiler flags, name the compiler version and command line.\n- When discussing memory allocation, name the allocation type, memory map state,\n  and phase.\n- When discussing HII/UI behavior, say whether semantics come from FormBrowser\n  or rendering comes from DisplayEngine.\n\n## Copyright And License\n\n- Keep existing file headers when modifying upstream files.\n- New edk2-compatible code usually follows the destination repository's license\n  and copyright conventions.\n- Do not copy vendor UI assets, fonts, logos, or private documentation into open\n  firmware projects without explicit compatible licensing.\n\n## Suggested Evidence Checklist\n\n- Build command and target.\n- Failing log or compiler diagnostic.\n- Source files and functions involved.\n- Before/after behavior.\n- Regression surface: architecture, platform, toolchain, and QEMU or hardware.\n", "references/workflows.md": "# UEFI Firmware Workflows\n\nPractical templates for UEFI/edk2 work. Use these as starting points and adjust\nfor the user's repo, platform, architecture, and toolchain. Prefer local evidence\nover memory.\n\n## 1. edk2 Build Orientation\n\nGoal: identify platform, packages, toolchain, build target, and generated artifacts.\n\n```sh\n# From edk2 workspace root\npwd\ngit status --short\ngit branch --show-current\n\n# Common setup; exact commands vary by platform docs\nsource edksetup.sh\nbuild -l build.log -a X64 -t GCC5 -b DEBUG -p OvmfPkg/OvmfPkgX64.dsc\n\n# Inspect the build result\nrg -n \"(error|warning|ASSERT|FATAL|GenFds|FV|FD)\" build.log\n```\n\nWhat to collect:\n\n- Workspace root, commit, branch, and local modifications.\n- DSC/FDF/INF involved: `*.dsc`, `*.fdf`, `*.inf`.\n- Architecture (`IA32`, `X64`, `AARCH64`, `RISCV64`), toolchain, target\n  (`DEBUG`/`RELEASE`).\n- Failing command, first error, and generated FV/FD paths.\n\n## 2. Source Search Patterns\n\nUse the fastest available local search. In agent environments, `search_files` is\npreferred when available; in a shell, use `rg` or `git grep`.\n\n```sh\n# Locate GUIDs, protocols, PPIs, library classes, and PCDs\nrg -n \"gEfi.*ProtocolGuid|EFI_.*_PROTOCOL|Pcd[A-Za-z0-9_]+\" .\ngit grep -n \"EFI_HII_CONFIG_ACCESS_PROTOCOL\"\n\n# Find module ownership and build inclusion\nrg -n \"MODULE_TYPE|LIBRARY_CLASS|DEPEX|INF\" --glob '*.inf' .\nrg -n \"SomeDriver.inf|SomeLibraryClass|SomePcd\" --glob '*.{dsc,fdf,dec,inf}' .\n\n# Trace HII/VFR/IFR paths\nrg -n \"VfrCompile|\\.vfr|HiiAddPackages|HiiSetString|ExtractConfig|RouteConfig\" .\n\n# Trace error/status handling\nrg -n \"EFI_(NOT_FOUND|UNSUPPORTED|INVALID_PARAMETER|OUT_OF_RESOURCES|ACCESS_DENIED)\" .\n```\n\nEvidence to report:\n\n- Exact file paths and line numbers.\n- Producer/consumer relationship for protocols, PPIs, HOBs, variables, or PCDs.\n- Whether behavior is common edk2 code, platform package code, or\n  vendor/platform policy.\n\n## 3. QEMU/OVMF Debug Template\n\nGoal: reproduce firmware behavior with serial logs and debuggable OVMF artifacts.\n\n```sh\n# Example OVMF DEBUG build\nsource edksetup.sh\nbuild -a X64 -t GCC5 -b DEBUG -p OvmfPkg/OvmfPkgX64.dsc\n\n# Typical QEMU serial-log run; adjust paths for your build tree\nqemu-system-x86_64 \\\n  -machine q35,accel=tcg \\\n  -m 2048 \\\n  -drive if=pflash,format=raw,readonly=on,file=Build/OvmfX64/DEBUG_GCC5/FV/OVMF_CODE.fd \\\n  -drive if=pflash,format=raw,file=Build/OvmfX64/DEBUG_GCC5/FV/OVMF_VARS.fd \\\n  -serial file:serial.log \\\n  -display none\n\nrg -n \"(ASSERT|ERROR|WARNING|Security|Bds|DXE|PEI|SMM|Status|EFI_)\" serial.log\n```\n\nUseful variations:\n\n- Add `-debugcon file:debug.log -global isa-debugcon.iobase=0x402` when the\n  platform supports debugcon.\n- Use `-s -S` for GDB attach when symbols and debug setup are available.\n- Preserve both `OVMF_CODE.fd` and a fresh writable `OVMF_VARS.fd` for\n  reproducibility.\n\nReport:\n\n- QEMU command, OVMF build target/toolchain, serial/debug log excerpts.\n- First failure point by phase, not just the last visible symptom.\n- Whether failure depends on variable store contents, disk image, Secure Boot\n  state, or architecture.\n\n## 4. HII/VFR/IFR Triage\n\nGoal: separate VFR source, compiled IFR, strings, varstore, browser behavior, and\nplatform display policy.\n\n```sh\n# Locate HII package production and form callbacks\nrg -n \"HiiAddPackages|HiiRemovePackages|EFI_HII_CONFIG_ACCESS_PROTOCOL\" .\nrg -n \"ExtractConfig|RouteConfig|Callback|ConfigAccess\" .\n\n# Locate VFR, strings, and varstores\nrg -n \"formset|varstore|oneof|numeric|checkbox|suppressif|grayoutif\" --glob '*.vfr' .\nrg -n \"STRING_TOKEN|\\.uni|HiiSetString|HiiGetString\" .\n\n# Locate generated/build references\nrg -n \"VfrCompile|IFR|FormBrowser|DisplayEngine\" Build .\n```\n\nChecklist:\n\n- Which driver calls `HiiAddPackages()`?\n- Which VFR formset/class GUID and varstore own the question?\n- Is the issue in VFR logic (`suppressif`/`grayoutif`), string resources,\n  `ConfigAccess`, variable defaults, or FormBrowser rendering?\n- Is the requested change standard HII behavior, edk2 browser implementation,\n  or platform UI policy?\n\n## 5. Behavior Verification Record\n\n**Rule:** Make verification repeatable and keep different evidence levels separate.\nUse only the fields relevant to the change; mark unperformed checks as not run.\n\n```text\nExpected behavior:\nSource revision and local changes:\nBuild configuration and command:\nGenerated artifact and actual load path (hash when useful):\nEnvironment and initial state:\nAction or test executed:\nObserved result and supporting log/capture:\nRelevant failure-path checks:\nNot verified:\n```\n\n**Example:** For a standalone Setup application, record the built application and\nits ESP destination, the page and interaction exercised, and the observed result.\nRecord persistence separately if it is part of the requirement.\n\n**Limit:** Building a host test is not executing it; executing it is not a target\nplatform boot test. Report each result at its actual scope.\n\n## 6. Firmware Patch Review Evidence\n\nUse this structure for review comments and summaries:\n\n```text\nScope: package/module/phase/architecture\nClaim: spec vs edk2 implementation vs platform policy\nEvidence: file:line, build log, serial log, spec URL/section if verified\nRisk: compatibility, security, FV size, variable migration, boot path, rollback\nVerification: build commands, QEMU/hardware tests, negative cases\nRecommendation: accept/change/request data\n```\n\nCommands that usually help:\n\n```sh\ngit status --short\ngit diff --stat\ngit diff --check\ngit diff -- '*.c' '*.h' '*.inf' '*.dsc' '*.fdf' '*.dec' '*.vfr' '*.uni'\nrg -n \"TODO|FIXME|ASSERT\\(|DEBUG\\(|EFI_ERROR|CopyMem|AsciiStr|StrCpy|PcdGet\" .\n```\n\nReview conservatively for:\n\n- SMM/MM, variable services, capsule update, Secure Boot, TPM/measured boot,\n  cryptography, and authentication paths.\n- Firmware volume size, alignment, PCD defaults, variable store compatibility,\n  and mixed architecture behavior.\n- Upstream style: minimal patch scope, clear commit message, `Signed-off-by`\n  when required, and no vendor-private claims or leaked identifiers.\n"}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('graph-data').textContent), docs=JSON.parse(document.getElementById('documents-data').textContent);
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',byId=new Map(data.nodes.map(n=>[n.id,n]));
let selected=null,edgeSelected=null,mode='global',visible=new Set(byId.keys()),shownEdges=[],camera={x:0,y:0,k:1};
function elem(tag,attrs={},text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
function allowed(){return data.edges.filter(e=>$('kind').value==='all'||e.kind===$('kind').value);}
function neighborhood(id,depth,edges){const found=new Set([id]);let frontier=[id];for(let i=0;i<depth&&frontier.length;i++){let next=[];for(const v of frontier)for(const e of edges){const w=e.source===v?e.target:e.target===v?e.source:null;if(w&&!found.has(w)){found.add(w);next.push(w);}}frontier=next;}return found;}
function transform(){$('camera').setAttribute('transform',`translate(${camera.x} ${camera.y}) scale(${camera.k})`);}
function fit(){const ns=data.nodes.filter(n=>visible.has(n.id));if(!ns.length)return;const w=$('graph').clientWidth,h=$('graph').clientHeight;const minX=Math.min(...ns.map(n=>n.x))-145,maxX=Math.max(...ns.map(n=>n.x))+145,minY=Math.min(...ns.map(n=>n.y))-70,maxY=Math.max(...ns.map(n=>n.y))+70;camera.k=Math.min(1.7,Math.max(.15,Math.min(w/(maxX-minX),h/(maxY-minY))*.93));camera.x=w/2-(minX+maxX)/2*camera.k;camera.y=h/2-(minY+maxY)/2*camera.k;transform();}
function zoom(f,x=$('graph').clientWidth/2,y=$('graph').clientHeight/2){const k=Math.max(.12,Math.min(4,camera.k*f));camera.x=x-(x-camera.x)*k/camera.k;camera.y=y-(y-camera.y)*k/camera.k;camera.k=k;transform();}
function endpoint(a,b){const dx=b.x-a.x,dy=b.y-a.y;const t=Math.min(dx?116/Math.abs(dx):Infinity,dy?23/Math.abs(dy):Infinity,.45);return {x:a.x+dx*t,y:a.y+dy*t};}
function render(reset=false){const edges=allowed();visible=mode==='global'?new Set(byId.keys()):neighborhood(selected,$('depth').value==='all'?data.nodes.length:Number($('depth').value),edges);shownEdges=edges.filter(e=>visible.has(e.source)&&visible.has(e.target));$('edges').replaceChildren();$('nodes').replaceChildren();
 for(const e of shownEdges){const a=byId.get(e.source),b=byId.get(e.target),start=endpoint(a,b),end=endpoint(b,a);const g=elem('g',{'class':`edge ${e.kind}${e.id===edgeSelected?' selected':''}`,'data-edge-id':e.id});g.append(elem('line',{x1:start.x,y1:start.y,x2:end.x,y2:end.y,stroke:'transparent','stroke-width':15}),elem('line',{x1:start.x,y1:start.y,x2:end.x,y2:end.y,'class':'stroke','marker-end':'url(#arrow)'}),elem('title',{},`${a.label} → ${e.label} → ${b.label}`));if($('labels').checked)g.append(elem('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5,'text-anchor':'middle'},e.label));g.addEventListener('click',ev=>{ev.stopPropagation();edgeSelected=e.id;render();showEdge(e);});$('edges').append(g);}
 for(const n of data.nodes.filter(n=>visible.has(n.id))){const g=elem('g',{'class':'node'+(selected===n.id?' selected':''),transform:`translate(${n.x} ${n.y})`,'data-node-id':n.id,tabindex:0,role:'button','aria-label':n.label});g.append(elem('rect',{x:-116,y:-23,width:232,height:46,rx:9,fill:'#ffffff',stroke:n.color}),elem('text',{'text-anchor':'middle',y:5,fill:n.color,'font-size':17},n.label.length>27?n.label.slice(0,25)+'…':n.label),elem('title',{},n.label));g.addEventListener('click',ev=>{ev.stopPropagation();if(suppressClick){suppressClick=false;return;}select(n.id);});g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id);}});g.addEventListener('pointerdown',ev=>startDrag(ev,n));$('nodes').append(g);}
 $('stats').textContent=`显示 ${visible.size} / ${data.nodes.length} 节点 · ${shownEdges.length} / ${data.edges.length} 关系 · ${mode==='global'?'全局':'围绕 '+byId.get(selected).label}`;
 $('global').classList.toggle('active',mode==='global');if(reset)fit();else transform();}
function select(id){selected=id;edgeSelected=null;mode='focus';render(true);showNode(byId.get(id));}
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
function button(label,fn,cls){const b=text('button',label,cls);b.onclick=fn;return b;}
function source(p){const block=document.createElement('div');block.append(button(`${p.path}:${p.line} · 查看原文`,()=>openDoc(p),'source'),text('blockquote',p.excerpt));return block;}
function openDoc(p){$('docTitle').textContent=`${p.path} · 来源行 ${p.line}`;$('docText').textContent=docs[p.path].split('\n').map((l,i)=>`${i+1}  ${l}`).join('\n');$('document').showModal();$('document').scrollTop=Math.max(0,(p.line-4)*22);}
function showNode(n){const p=$('panel');p.replaceChildren(text('h2',n.label),text('p',`${n.group} · 点击关联节点继续发散`,'muted'));for(const s of n.sources)p.append(source(s));p.append(text('h3','直接关联（方向按关系定义）'));for(const e of data.edges.filter(e=>e.source===n.id||e.target===n.id)){const outgoing=e.source===n.id,other=byId.get(outgoing?e.target:e.source);p.append(button(`${outgoing?'→':'←'} ${e.label} · ${other.label}`,()=>{edgeSelected=e.id;render();showEdge(e);},'relation'));}p.append(text('p','展开层数按双向邻接计算，仅供导航；不把连通路径当作因果推断。','muted'));}
function showEdge(e){const a=byId.get(e.source),b=byId.get(e.target),p=$('panel');p.replaceChildren(text('h2',e.label),button(a.label,()=>select(a.id),'relation'),text('p','↓ '+e.label),button(b.label,()=>select(b.id),'relation'),text('p',`类型：${{semantic:'有原文依据的主题关系',reference:'文档显式引用',index:'文档到主题索引'}[e.kind]}`,'muted'),source(e.evidence));if(e.occurrences)p.append(text('p',`合并了 ${e.occurrences.length} 处相同目标引用；全部位置保存在 network.json。`,'muted'));}
function intro(){$('panel').replaceChildren(text('h2','从任意节点开始'),text('p','点击节点：围绕它展开。选择 1 层、2 层或全部连通关系；点“全局关系”恢复所有节点。'),text('p','滚轮缩放；拖动空白平移；拖动节点调整位置；勾选连线标签或点击连线查看依据。'),text('h3','数据范围'),text('p',data.scope),text('p','全部关系 = 当前文档中的明确引用 + 已整理且有原文依据的主题关系。并不表示穷尽了文档中的每个隐含概念。','muted'),text('h3','Agent 入口'),text('p','SKILL.md 按问题路由；network.json 提供稳定节点 ID、类型、邻接关系和原文位置。scripts/query_network.py 可精确搜索和展开，不要求识图。'));}
$('global').onclick=()=>{mode='global';selected=null;edgeSelected=null;render(true);intro();};$('depth').onchange=()=>render(true);$('kind').onchange=()=>render(true);$('labels').onchange=()=>render();$('fit').onclick=fit;$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);$('closeDoc').onclick=()=>$('document').close();
$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase();$('results').replaceChildren();if(!q)return;const matches=data.nodes.filter(n=>[n.id,n.label,n.summary,...n.sources.map(s=>s.path)].join(' ').toLowerCase().includes(q));for(const n of matches)$('results').append(button(n.label,()=>select(n.id)));if(!matches.length)$('results').append(text('span','没有匹配节点；可尝试符号、文档名或现象关键词。','muted'));};
let drag=null,suppressClick=false;
function startDrag(ev,node){if(ev.button!==0)return;ev.stopPropagation();drag={node,x:ev.clientX,y:ev.clientY,moved:false,pointer:ev.pointerId};$('graph').setPointerCapture(ev.pointerId);}
$('graph').addEventListener('pointerdown',ev=>{if(ev.button!==0||ev.target.closest('.edge'))return;startDrag(ev,null);});
$('graph').addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;drag.x=ev.clientX;drag.y=ev.clientY;if(drag.node){drag.node.x+=dx/camera.k;drag.node.y+=dy/camera.k;render();}else{camera.x+=dx;camera.y+=dy;transform();}});
$('graph').addEventListener('pointerup',ev=>{if(drag){const d=drag;drag=null;$('graph').releasePointerCapture(ev.pointerId);if(d.node&&!d.moved)select(d.node.id);suppressClick=d.moved;setTimeout(()=>suppressClick=false,0);}});
$('graph').addEventListener('pointercancel',()=>{drag=null;});$('graph').addEventListener('wheel',ev=>{ev.preventDefault();const r=$('graph').getBoundingClientRect();zoom(Math.exp(-ev.deltaY*.0015),ev.clientX-r.left,ev.clientY-r.top);},{passive:false});
for(const [group,color] of new Map(data.nodes.map(n=>[n.group,n.color]))){const s=text('span',group,'chip'),dot=text('span','','dot');dot.style.background=color;s.prepend(dot);$('legend').append(s);}
window.addEventListener('resize',fit);render(true);intro();
// Read-only diagnostic snapshot used by browser smoke tests.
window.networkState=()=>({mode,selected,nodes:visible.size,edges:shownEdges.length,totalNodes:data.nodes.length,totalEdges:data.edges.length,zoom:camera.k});
</script></body></html>
