<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UEFI Skill · 关系网络</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Noto Sans CJK SC",sans-serif;color:#172033;background:#f8fafc}*{box-sizing:border-box}body{margin:0}header{padding:16px 22px;border-bottom:1px solid #cbd5e1}h1{font-size:23px;margin:0 0 6px}p{line-height:1.6}header p{margin:0;color:#475569;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #cbd5e1;align-items:center}button,select,input{font:inherit;color:#172033;border:1px solid #94a3b8;background:#ffffff;border-radius:7px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:#1d4ed8}button.active{background:#dbeafe;border-color:#1d4ed8}input{min-width:210px;flex:1}label{font-size:14px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 170px);min-height:500px}.canvas{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#ffffff,#f8fafc)}#graph{width:100%;height:100%;display:block;touch-action:none;user-select:none}.node{cursor:pointer}.node rect{stroke-width:1.4}.node.selected rect{stroke:#1d4ed8;stroke-width:3}.node text{pointer-events:none}.edge{cursor:pointer}.edge .stroke{stroke:#64748b;stroke-width:2}.edge.reference .stroke,.edge.index .stroke{stroke:#7b8ba1;stroke-dasharray:5 5}.edge:hover .stroke,.edge.selected .stroke{stroke:#1d4ed8;stroke-width:3}.edge text{fill:#334155;font-size:14px;paint-order:stroke;stroke:#f8fafc;stroke-width:4px;pointer-events:none}aside{border-left:1px solid #cbd5e1;padding:18px;overflow:auto;background:#ffffff}aside h2{font-size:19px}aside h3{font-size:16px}.muted{color:#475569;font-size:13px}#stats{position:absolute;bottom:14px;left:14px;padding:8px 12px;background:#ffffffed;border:1px solid #cbd5e1;border-radius:7px;font-size:13px;pointer-events:none}.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;font-size:12px}.chip{display:inline-flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}.relation{display:block;text-align:left;width:100%;margin:7px 0;font-size:13px}.source{display:block;margin:9px 0;text-align:left;font-size:12px;overflow-wrap:anywhere}blockquote{margin:12px 0;padding:10px;border-left:3px solid #1d4ed8;background:#ffffff;white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere}#results{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px}#results:not(:empty){padding-bottom:10px}dialog{width:min(1000px,94vw);height:85vh;background:#ffffff;color:#172033;border:1px solid #94a3b8;border-radius:12px;padding:20px}dialog::backdrop{background:#000a}dialog pre{white-space:pre-wrap;line-height:1.6;font:14px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.dochead{display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;background:#ffffff}#docTitle{font-size:15px;overflow-wrap:anywhere}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1d4ed8;outline-offset:2px}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}.canvas{height:65vh;min-height:420px}aside{border-left:0;border-top:1px solid #cbd5e1;max-height:60vh}.toolbar{padding:10px}header{padding:12px}#stats{font-size:11px}}
</style></head>
<body><header><h1>UEFI Skill · 从一个问题，展开全部关联</h1><p>全局看结构，点节点看关联，点连线查依据。图是显式知识导航，不是模型内部思维记录。</p><div id="legend" class="legend"></div></header>
<div class="toolbar"><button id="global" class="active">全局关系</button><label>展开 <select id="depth"><option value="1">1 层邻居</option><option value="2">2 层关联</option><option value="all">全部连通关系</option></select></label><label>关系 <select id="kind"><option value="all">全部类型</option><option value="semantic">主题关系</option><option value="reference">文档引用</option><option value="index">文档 → 主题</option></select></label><label><input id="labels" type="checkbox" style="min-width:0;vertical-align:middle"> 连线标签</label><button id="fit">适应画面</button><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">－</button><input id="search" type="search" placeholder="搜索：启动项、HII、依赖、GenFw…" aria-label="搜索节点"></div>
<div id="results" aria-live="polite"></div>
<main><div class="canvas"><svg id="graph" xmlns="http://www.w3.org/2000/svg" aria-label="可交互知识关系图"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8" refY="4" viewBox="0 0 8 8" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><g id="camera"><g id="edges"></g><g id="nodes"></g></g></svg><div id="stats" aria-live="polite"></div></div><aside id="panel"></aside></main>
<dialog id="document"><div class="dochead"><strong id="docTitle"></strong><button id="closeDoc">关闭</button></div><pre id="docText"></pre></dialog>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script><script id="documents-data" type="application/json">__DOCUMENTS_JSON__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('graph-data').textContent), docs=JSON.parse(document.getElementById('documents-data').textContent);
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',byId=new Map(data.nodes.map(n=>[n.id,n]));
let selected=null,edgeSelected=null,mode='global',visible=new Set(byId.keys()),shownEdges=[],camera={x:0,y:0,k:1};
function elem(tag,attrs={},text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;return e;}
function allowed(){return data.edges.filter(e=>$('kind').value==='all'||e.kind===$('kind').value);}
function neighborhood(id,depth,edges){const found=new Set([id]);let frontier=[id];for(let i=0;i<depth&&frontier.length;i++){let next=[];for(const v of frontier)for(const e of edges){const w=e.source===v?e.target:e.target===v?e.source:null;if(w&&!found.has(w)){found.add(w);next.push(w);}}frontier=next;}return found;}
function transform(){$('camera').setAttribute('transform',`translate(${camera.x} ${camera.y}) scale(${camera.k})`);}
function fit(){const ns=data.nodes.filter(n=>visible.has(n.id));if(!ns.length)return;const w=$('graph').clientWidth,h=$('graph').clientHeight;const minX=Math.min(...ns.map(n=>n.x))-145,maxX=Math.max(...ns.map(n=>n.x))+145,minY=Math.min(...ns.map(n=>n.y))-70,maxY=Math.max(...ns.map(n=>n.y))+70;camera.k=Math.min(1.7,Math.max(.15,Math.min(w/(maxX-minX),h/(maxY-minY))*.93));camera.x=w/2-(minX+maxX)/2*camera.k;camera.y=h/2-(minY+maxY)/2*camera.k;transform();}
function zoom(f,x=$('graph').clientWidth/2,y=$('graph').clientHeight/2){const k=Math.max(.12,Math.min(4,camera.k*f));camera.x=x-(x-camera.x)*k/camera.k;camera.y=y-(y-camera.y)*k/camera.k;camera.k=k;transform();}
function endpoint(a,b){const dx=b.x-a.x,dy=b.y-a.y;const t=Math.min(dx?116/Math.abs(dx):Infinity,dy?23/Math.abs(dy):Infinity,.45);return {x:a.x+dx*t,y:a.y+dy*t};}
function render(reset=false){const edges=allowed();visible=mode==='global'?new Set(byId.keys()):neighborhood(selected,$('depth').value==='all'?data.nodes.length:Number($('depth').value),edges);shownEdges=edges.filter(e=>visible.has(e.source)&&visible.has(e.target));$('edges').replaceChildren();$('nodes').replaceChildren();
 for(const e of shownEdges){const a=byId.get(e.source),b=byId.get(e.target),start=endpoint(a,b),end=endpoint(b,a);const g=elem('g',{'class':`edge ${e.kind}${e.id===edgeSelected?' selected':''}`,'data-edge-id':e.id});g.append(elem('line',{x1:start.x,y1:start.y,x2:end.x,y2:end.y,stroke:'transparent','stroke-width':15}),elem('line',{x1:start.x,y1:start.y,x2:end.x,y2:end.y,'class':'stroke','marker-end':'url(#arrow)'}),elem('title',{},`${a.label} → ${e.label} → ${b.label}`));if($('labels').checked)g.append(elem('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-5,'text-anchor':'middle'},e.label));g.addEventListener('click',ev=>{ev.stopPropagation();edgeSelected=e.id;render();showEdge(e);});$('edges').append(g);}
 for(const n of data.nodes.filter(n=>visible.has(n.id))){const g=elem('g',{'class':'node'+(selected===n.id?' selected':''),transform:`translate(${n.x} ${n.y})`,'data-node-id':n.id,tabindex:0,role:'button','aria-label':n.label});g.append(elem('rect',{x:-116,y:-23,width:232,height:46,rx:9,fill:'#ffffff',stroke:n.color}),elem('text',{'text-anchor':'middle',y:5,fill:n.color,'font-size':17},n.label.length>27?n.label.slice(0,25)+'…':n.label),elem('title',{},n.label));g.addEventListener('click',ev=>{ev.stopPropagation();if(suppressClick){suppressClick=false;return;}select(n.id);});g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(n.id);}});g.addEventListener('pointerdown',ev=>startDrag(ev,n));$('nodes').append(g);}
 $('stats').textContent=`显示 ${visible.size} / ${data.nodes.length} 节点 · ${shownEdges.length} / ${data.edges.length} 关系 · ${mode==='global'?'全局':'围绕 '+byId.get(selected).label}`;
 $('global').classList.toggle('active',mode==='global');if(reset)fit();else transform();}
function select(id){selected=id;edgeSelected=null;mode='focus';render(true);showNode(byId.get(id));}
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
function button(label,fn,cls){const b=text('button',label,cls);b.onclick=fn;return b;}
function source(p){const block=document.createElement('div');block.append(button(`${p.path}:${p.line} · 查看原文`,()=>openDoc(p),'source'),text('blockquote',p.excerpt));return block;}
function openDoc(p){$('docTitle').textContent=`${p.path} · 来源行 ${p.line}`;$('docText').textContent=docs[p.path].split('\n').map((l,i)=>`${i+1}  ${l}`).join('\n');$('document').showModal();$('document').scrollTop=Math.max(0,(p.line-4)*22);}
function showNode(n){const p=$('panel');p.replaceChildren(text('h2',n.label),text('p',`${n.group} · 点击关联节点继续发散`,'muted'));for(const s of n.sources)p.append(source(s));p.append(text('h3','直接关联（方向按关系定义）'));for(const e of data.edges.filter(e=>e.source===n.id||e.target===n.id)){const outgoing=e.source===n.id,other=byId.get(outgoing?e.target:e.source);p.append(button(`${outgoing?'→':'←'} ${e.label} · ${other.label}`,()=>{edgeSelected=e.id;render();showEdge(e);},'relation'));}p.append(text('p','展开层数按双向邻接计算，仅供导航；不把连通路径当作因果推断。','muted'));}
function showEdge(e){const a=byId.get(e.source),b=byId.get(e.target),p=$('panel');p.replaceChildren(text('h2',e.label),button(a.label,()=>select(a.id),'relation'),text('p','↓ '+e.label),button(b.label,()=>select(b.id),'relation'),text('p',`类型：${{semantic:'有原文依据的主题关系',reference:'文档显式引用',index:'文档到主题索引'}[e.kind]}`,'muted'),source(e.evidence));if(e.occurrences)p.append(text('p',`合并了 ${e.occurrences.length} 处相同目标引用；全部位置保存在 network.json。`,'muted'));}
function intro(){$('panel').replaceChildren(text('h2','从任意节点开始'),text('p','点击节点：围绕它展开。选择 1 层、2 层或全部连通关系；点“全局关系”恢复所有节点。'),text('p','滚轮缩放；拖动空白平移；拖动节点调整位置；勾选连线标签或点击连线查看依据。'),text('h3','数据范围'),text('p',data.scope),text('p','全部关系 = 当前文档中的明确引用 + 已整理且有原文依据的主题关系。并不表示穷尽了文档中的每个隐含概念。','muted'),text('h3','Agent 入口'),text('p','SKILL.md 按问题路由；network.json 提供稳定节点 ID、类型、邻接关系和原文位置。scripts/query_network.py 可精确搜索和展开，不要求识图。'));}
$('global').onclick=()=>{mode='global';selected=null;edgeSelected=null;render(true);intro();};$('depth').onchange=()=>render(true);$('kind').onchange=()=>render(true);$('labels').onchange=()=>render();$('fit').onclick=fit;$('zoomIn').onclick=()=>zoom(1.25);$('zoomOut').onclick=()=>zoom(.8);$('closeDoc').onclick=()=>$('document').close();
$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase();$('results').replaceChildren();if(!q)return;const matches=data.nodes.filter(n=>[n.id,n.label,n.summary,...n.sources.map(s=>s.path)].join(' ').toLowerCase().includes(q));for(const n of matches)$('results').append(button(n.label,()=>select(n.id)));if(!matches.length)$('results').append(text('span','没有匹配节点；可尝试符号、文档名或现象关键词。','muted'));};
let drag=null,suppressClick=false;
function startDrag(ev,node){if(ev.button!==0)return;ev.stopPropagation();drag={node,x:ev.clientX,y:ev.clientY,moved:false,pointer:ev.pointerId};$('graph').setPointerCapture(ev.pointerId);}
$('graph').addEventListener('pointerdown',ev=>{if(ev.button!==0||ev.target.closest('.edge'))return;startDrag(ev,null);});
$('graph').addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;drag.x=ev.clientX;drag.y=ev.clientY;if(drag.node){drag.node.x+=dx/camera.k;drag.node.y+=dy/camera.k;render();}else{camera.x+=dx;camera.y+=dy;transform();}});
$('graph').addEventListener('pointerup',ev=>{if(drag){const d=drag;drag=null;$('graph').releasePointerCapture(ev.pointerId);if(d.node&&!d.moved)select(d.node.id);suppressClick=d.moved;setTimeout(()=>suppressClick=false,0);}});
$('graph').addEventListener('pointercancel',()=>{drag=null;});$('graph').addEventListener('wheel',ev=>{ev.preventDefault();const r=$('graph').getBoundingClientRect();zoom(Math.exp(-ev.deltaY*.0015),ev.clientX-r.left,ev.clientY-r.top);},{passive:false});
for(const [group,color] of new Map(data.nodes.map(n=>[n.group,n.color]))){const s=text('span',group,'chip'),dot=text('span','','dot');dot.style.background=color;s.prepend(dot);$('legend').append(s);}
window.addEventListener('resize',fit);render(true);intro();
// Read-only diagnostic snapshot used by browser smoke tests.
window.networkState=()=>({mode,selected,nodes:visible.size,edges:shownEdges.length,totalNodes:data.nodes.length,totalEdges:data.edges.length,zoom:camera.k});
</script></body></html>
